<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9054;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFE8D6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#grad2)"/>

  <!-- Analytics Dashboard Representation -->
  <g opacity="0.3">
    <!-- Dashboard Container -->
    <rect x="150" y="120" width="900" height="560" rx="16" fill="white"/>

    <!-- Header Bar -->
    <rect x="150" y="120" width="900" height="80" rx="16" fill="rgba(255,255,255,0.5)"/>

    <!-- Chart Elements -->
    <rect x="200" y="250" width="350" height="200" rx="8" fill="rgba(255,255,255,0.6)"/>
    <rect x="600" y="250" width="400" height="200" rx="8" fill="rgba(255,255,255,0.6)"/>
    <rect x="200" y="490" width="800" height="150" rx="8" fill="rgba(255,255,255,0.6)"/>

    <!-- Bar Chart Representation -->
    <rect x="220" y="350" width="40" height="80" fill="rgba(76, 64, 247, 0.5)"/>
    <rect x="280" y="320" width="40" height="110" fill="rgba(76, 64, 247, 0.5)"/>
    <rect x="340" y="300" width="40" height="130" fill="rgba(76, 64, 247, 0.5)"/>
    <rect x="400" y="280" width="40" height="150" fill="rgba(76, 64, 247, 0.5)"/>
    <rect x="460" y="310" width="40" height="120" fill="rgba(76, 64, 247, 0.5)"/>
  </g>

  <text x="600" y="720" font-family="system-ui, sans-serif" font-size="36" font-weight="600" fill="white" text-anchor="middle">SaaS Analytics Dashboard</text>
</svg>
