<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4C40F7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6B61FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#grad1)"/>

  <!-- Microservices Architecture Representation -->
  <g opacity="0.2">
    <rect x="100" y="150" width="250" height="180" rx="12" fill="white"/>
    <rect x="400" y="150" width="250" height="180" rx="12" fill="white"/>
    <rect x="700" y="150" width="250" height="180" rx="12" fill="white"/>
    <rect x="250" y="450" width="250" height="180" rx="12" fill="white"/>
    <rect x="600" y="450" width="250" height="180" rx="12" fill="white"/>

    <!-- Connection Lines -->
    <line x1="225" y1="330" x2="375" y2="450" stroke="white" stroke-width="3"/>
    <line x1="525" y1="330" x2="375" y2="450" stroke="white" stroke-width="3"/>
    <line x1="525" y1="330" x2="725" y2="450" stroke="white" stroke-width="3"/>
    <line x1="825" y1="330" x2="725" y2="450" stroke="white" stroke-width="3"/>
  </g>

  <text x="600" y="720" font-family="system-ui, sans-serif" font-size="36" font-weight="600" fill="white" text-anchor="middle">Enterprise Microservices Platform</text>
</svg>
