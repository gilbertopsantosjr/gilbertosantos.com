<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E6F9F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4C40F7;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#grad3)"/>

  <!-- Event-Driven Payment System -->
  <g opacity="0.25">
    <!-- Central Event Bus -->
    <ellipse cx="600" cy="400" rx="120" ry="80" fill="white"/>
    <text x="600" y="410" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#4C40F7" text-anchor="middle">Event Bus</text>

    <!-- Services Around -->
    <circle cx="300" cy="250" r="70" fill="white"/>
    <circle cx="900" cy="250" r="70" fill="white"/>
    <circle cx="300" cy="550" r="70" fill="white"/>
    <circle cx="900" cy="550" r="70" fill="white"/>

    <!-- Arrows -->
    <path d="M 370 250 L 480 350" stroke="white" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 830 250 L 720 350" stroke="white" stroke-width="4" fill="none"/>
    <path d="M 370 550 L 480 450" stroke="white" stroke-width="4" fill="none"/>
    <path d="M 830 550 L 720 450" stroke="white" stroke-width="4" fill="none"/>
  </g>

  <text x="600" y="720" font-family="system-ui, sans-serif" font-size="36" font-weight="600" fill="white" text-anchor="middle">Event-Driven Payment System</text>
</svg>
