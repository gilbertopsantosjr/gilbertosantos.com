<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF9E6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF9054;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#grad5)"/>

  <!-- Real-Time Collaboration -->
  <g opacity="0.3">
    <!-- Main Workspace -->
    <rect x="200" y="150" width="800" height="500" rx="16" fill="white"/>

    <!-- Toolbar -->
    <rect x="200" y="150" width="800" height="60" rx="16" fill="rgba(255,255,255,0.7)"/>
    <circle cx="240" cy="180" r="12" fill="rgba(76, 64, 247, 0.3)"/>
    <circle cx="280" cy="180" r="12" fill="rgba(76, 64, 247, 0.3)"/>
    <circle cx="320" cy="180" r="12" fill="rgba(76, 64, 247, 0.3)"/>

    <!-- Content Area with Collaborative Elements -->
    <rect x="250" y="250" width="700" height="80" rx="8" fill="rgba(76, 64, 247, 0.1)"/>
    <rect x="250" y="360" width="500" height="80" rx="8" fill="rgba(76, 64, 247, 0.1)"/>
    <rect x="250" y="470" width="650" height="80" rx="8" fill="rgba(76, 64, 247, 0.1)"/>

    <!-- User Avatars -->
    <circle cx="900" cy="580" r="20" fill="#4C40F7"/>
    <circle cx="940" cy="580" r="20" fill="#6B61FF"/>
    <circle cx="980" cy="580" r="20" fill="#FF9054"/>

    <!-- Sync Indicator -->
    <circle cx="960" cy="190" r="15" fill="rgba(76, 64, 247, 0.5)"/>
  </g>

  <text x="600" y="720" font-family="system-ui, sans-serif" font-size="36" font-weight="600" fill="white" text-anchor="middle">Real-Time Collaboration Tool</text>
</svg>
