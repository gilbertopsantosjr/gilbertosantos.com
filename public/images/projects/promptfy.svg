    <rect x="1046" y="280" width="96" height="40" rx="20" fill="#FFFFFF" opacity="0.95"/>
    <text x="1094" y="306" fill="#3A30C5" text-anchor="middle">Cursor</text>
    <rect x="1046" y="375" width="96" height="40" rx="20" fill="#FFFFFF" opacity="0.95"/>
