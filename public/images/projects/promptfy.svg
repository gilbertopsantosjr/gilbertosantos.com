<svg width="1200" height="600" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A30C5"/>
      <stop offset="100%" stop-color="#6B61FF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <g opacity="0.08" fill="#FFFFFF">
    <circle cx="1100" cy="60" r="160"/>
    <circle cx="80" cy="560" r="120"/>
  </g>

  <!-- Wordmark -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" fill="#FFFFFF">
    <rect x="90" y="215" width="64" height="64" rx="16" fill="#FFFFFF"/>
    <text x="122" y="260" font-size="36" font-weight="800" fill="#4C40F7" text-anchor="middle">P</text>
    <text x="176" y="262" font-size="52" font-weight="700">Promptfy</text>
    <text x="92" y="330" font-size="24" opacity="0.85">The home for AI prompts</text>
    <text x="92" y="366" font-size="20" opacity="0.65">Versioned library · Marketplace · MCP</text>
  </g>

  <!-- Prompt card -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace">
    <rect x="610" y="160" width="360" height="280" rx="18" fill="#FFFFFF"/>
    <rect x="610" y="160" width="360" height="48" rx="18" fill="#F5F6F8"/>
    <rect x="610" y="190" width="360" height="18" fill="#F5F6F8"/>
    <circle cx="636" cy="184" r="6" fill="#FF6B6B"/>
    <circle cx="656" cy="184" r="6" fill="#FF9054"/>
    <circle cx="676" cy="184" r="6" fill="#6B61FF"/>
    <text x="940" y="190" font-size="15" fill="#64748B" text-anchor="end">v12</text>
    <text x="634" y="244" font-size="17" fill="#2D3142">Summarize the</text>
    <rect x="782" y="226" width="96" height="26" rx="6" fill="#E8E6FF"/>
    <text x="830" y="244" font-size="15" fill="#4C40F7" text-anchor="middle">{{doc}}</text>
    <text x="634" y="278" font-size="17" fill="#2D3142">for an audience of</text>
    <rect x="634" y="292" width="124" height="26" rx="6" fill="#E8E6FF"/>
    <text x="696" y="310" font-size="15" fill="#4C40F7" text-anchor="middle">{{reader}}</text>
    <text x="766" y="310" font-size="17" fill="#2D3142">in</text>
    <rect x="792" y="292" width="92" height="26" rx="6" fill="#E8E6FF"/>
    <text x="838" y="310" font-size="15" fill="#4C40F7" text-anchor="middle">{{tone}}</text>
    <rect x="634" y="336" width="250" height="10" rx="5" fill="#E8EAEF"/>
    <rect x="634" y="356" width="190" height="10" rx="5" fill="#E8EAEF"/>
    <rect x="634" y="392" width="112" height="32" rx="16" fill="#4C40F7"/>
    <text x="690" y="413" font-size="15" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600">Run ▸</text>
  </g>

  <!-- MCP connections -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">
    <path d="M970 250 C1010 250 1010 205 1046 205" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-dasharray="6 6" opacity="0.8"/>
    <path d="M970 300 L1046 300" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-dasharray="6 6" opacity="0.8"/>
    <path d="M970 350 C1010 350 1010 395 1046 395" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-dasharray="6 6" opacity="0.8"/>
    <rect x="1046" y="185" width="96" height="40" rx="20" fill="#FFFFFF" opacity="0.95"/>
