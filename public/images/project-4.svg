<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8E6FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4C40F7;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#grad4)"/>

  <!-- Cloud Migration -->
  <g opacity="0.3">
    <!-- On-Premise (Left Side) -->
    <g>
      <rect x="100" y="300" width="350" height="200" rx="12" fill="white"/>
      <text x="275" y="360" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#4C40F7" text-anchor="middle">Legacy</text>
      <text x="275" y="390" font-family="system-ui, sans-serif" font-size="18" fill="#6B61FF" text-anchor="middle">On-Premise</text>
      <rect x="130" y="420" width="80" height="60" rx="6" fill="rgba(76, 64, 247, 0.2)"/>
      <rect x="230" y="420" width="80" height="60" rx="6" fill="rgba(76, 64, 247, 0.2)"/>
      <rect x="330" y="420" width="80" height="60" rx="6" fill="rgba(76, 64, 247, 0.2)"/>
    </g>

    <!-- Arrow -->
    <path d="M 500 400 L 650 400" stroke="white" stroke-width="6" fill="none"/>
    <polygon points="650,385 680,400 650,415" fill="white"/>

    <!-- Cloud (Right Side) -->
    <g>
      <rect x="750" y="300" width="350" height="200" rx="12" fill="white"/>
      <text x="925" y="360" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#4C40F7" text-anchor="middle">Cloud-Native</text>
      <text x="925" y="390" font-family="system-ui, sans-serif" font-size="18" fill="#6B61FF" text-anchor="middle">AWS</text>

      <!-- Cloud Boxes -->
      <rect x="780" y="420" width="70" height="50" rx="6" fill="rgba(76, 64, 247, 0.3)"/>
      <rect x="865" y="420" width="70" height="50" rx="6" fill="rgba(76, 64, 247, 0.3)"/>
      <rect x="950" y="420" width="70" height="50" rx="6" fill="rgba(76, 64, 247, 0.3)"/>
      <rect x="1035" y="420" width="50" height="50" rx="6" fill="rgba(76, 64, 247, 0.3)"/>
    </g>
  </g>

  <text x="600" y="720" font-family="system-ui, sans-serif" font-size="36" font-weight="600" fill="white" text-anchor="middle">Cloud Migration Project</text>
</svg>
