<svg width="1200" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(76, 64, 247, 0.03);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(107, 97, 255, 0.05);stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Layered waves for depth -->
  <path d="M0 300 Q300 250 600 300 T1200 300 L1200 600 L0 600 Z" fill="url(#waveGradient)" opacity="0.3"/>
  <path d="M0 350 Q300 300 600 350 T1200 350 L1200 600 L0 600 Z" fill="url(#waveGradient)" opacity="0.2"/>
  <path d="M0 400 Q300 350 600 400 T1200 400 L1200 600 L0 600 Z" fill="url(#waveGradient)" opacity="0.1"/>
</svg>
