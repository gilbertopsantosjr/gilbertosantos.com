<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="circuit" width="200" height="200" patternUnits="userSpaceOnUse">
      <!-- Circuit lines -->
      <path d="M0 50 L50 50 L50 100 L100 100" stroke="rgba(76, 64, 247, 0.06)" stroke-width="1.5" fill="none"/>
      <path d="M100 0 L100 50 L150 50 L150 100" stroke="rgba(76, 64, 247, 0.06)" stroke-width="1.5" fill="none"/>
      <path d="M50 150 L100 150 L100 100" stroke="rgba(76, 64, 247, 0.06)" stroke-width="1.5" fill="none"/>
      <path d="M150 150 L150 100 L200 100" stroke="rgba(76, 64, 247, 0.06)" stroke-width="1.5" fill="none"/>

      <!-- Connection nodes -->
      <circle cx="50" cy="50" r="4" fill="rgba(76, 64, 247, 0.1)"/>
      <circle cx="100" cy="50" r="3" fill="rgba(76, 64, 247, 0.08)"/>
      <circle cx="50" cy="100" r="3" fill="rgba(76, 64, 247, 0.08)"/>
      <circle cx="100" cy="100" r="5" fill="rgba(76, 64, 247, 0.12)"/>
      <circle cx="150" cy="50" r="3" fill="rgba(76, 64, 247, 0.08)"/>
      <circle cx="150" cy="100" r="4" fill="rgba(76, 64, 247, 0.1)"/>
      <circle cx="100" cy="150" r="3" fill="rgba(76, 64, 247, 0.08)"/>
      <circle cx="150" cy="150" r="3" fill="rgba(76, 64, 247, 0.08)"/>

      <!-- Subtle glow effect -->
      <circle cx="100" cy="100" r="8" fill="rgba(107, 97, 255, 0.03)"/>
    </pattern>
  </defs>
  <rect width="200" height="200" fill="url(#circuit)"/>
</svg>
